services:
  postgres:
    image: postgres:16-alpine
    container_name: valorant-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: valorant
      POSTGRES_PASSWORD: valorant
      POSTGRES_DB: valorant_intelligence
    ports: ["5432:5432"]
    volumes: ["valorant_pgdata:/var/lib/postgresql/data"]
volumes:
  valorant_pgdata:
